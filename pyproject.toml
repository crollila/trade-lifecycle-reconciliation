[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-lifecycle-reconciliation"
version = "1.0.0"
description = "Deterministic multi-venue trade capture, lifecycle, position and reconciliation system (synthetic data)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["duckdb>=1.1", "pandas>=2.1", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
tlr = "tlr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tlr = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 140
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"src/tlr/report.py" = ["E501"]  # generated markdown rows and SQL text
